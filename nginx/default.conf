# Proxy reverso do Achados & Perdidos (bônus A).
# Único serviço que publica porta no host (8080 -> 80); o "web" só é alcançável
# pela rede interna, como "web:5000".

# Fotos: só tipos de imagem comuns são exibidos no navegador; qualquer outro
# tipo enviado como "foto" (html, svg, js...) é forçado a baixar como arquivo.
map $upstream_http_content_type $disposicao_foto {
    default                              "attachment";
    "~^image/(png|jpeg|gif|webp)"        "inline";
}

# DNS interno do Docker (127.0.0.11). O nome "web" é resolvido de novo a cada 10 s,
# então o proxy continua funcionando quando o contêiner web é recriado e passa a
# distribuir as requisições entre várias réplicas (docker compose up --scale web=3).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    server_tokens off;

    # O padrão do Nginx (1 MB) rejeitaria fotos de celular com "413".
    client_max_body_size 10m;

    location / {
        set $destino_web http://web:5000;
        proxy_pass $destino_web;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /fotos/ {
        set $destino_web http://web:5000;
        proxy_pass $destino_web;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mitigação para arquivos enviados pelos usuários (o app.py não valida o tipo):
        # sem "sniffing" de tipo, sem scripts e sem acesso à origem do site.
        # O Flask já envia um Content-Disposition; ele é descartado para não haver
        # dois cabeçalhos diferentes (alguns navegadores recusam a resposta).
        proxy_hide_header Content-Disposition;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Content-Disposition $disposicao_foto always;
    }
}
